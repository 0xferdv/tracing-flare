[package]
name = "tracing-flare"
version = "0.1.0"
edition = "2021"
description = "Tracing-native, pure Rust logging with a self-contained flare core"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/tracing-flare"
repository = "https://github.com/0xferdv/tracing-flare"
rust-version = "1.82"
keywords = ["logging", "tracing", "observability", "log", "rotation"]
categories = ["development-tools::debugging"]

[lib]
name = "tracing_flare"

[features]
default = []
# Opt-in global allocator. A library must not silently replace the host application's
# allocator, so this is a feature rather than a mandatory dependency.
mimalloc = ["dep:mimalloc"]
# Lightweight compatibility backend built on tracing-appender + tracing-subscriber::fmt.
# It does not replace the full Flare engine (rotation/compression/health semantics differ).
appender-lite = ["dep:tracing-appender", "tracing-subscriber/fmt"]
# Optional Serialize implementations for health/metrics snapshots.
serde = ["dep:serde"]
# JSON Lines output. Text formatting remains the default; this only changes the renderer.
json = ["dep:serde_json"]
# Opt-in Python-style logger hierarchy: parent/effective level, propagation, per-logger
# handlers and a root/global handler list. Default `get_logger` semantics are unchanged.
python-hierarchy = []
# Archive compression codecs. Heavy/native dependencies stay opt-in; enabling any codec makes the
# corresponding `FlareCompression` variant usable. `compression` enables all three.
compression = ["compression-gzip", "compression-zstd", "compression-lz4"]
compression-gzip = ["dep:flate2", "dep:rayon"]
compression-zstd = ["dep:zstd"]
compression-lz4 = ["dep:lz4_flex"]

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry", "std"] }
arc-swap = "1.9.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
smallvec = "1.16.6"
flate2 = { version = "1.1.11", optional = true }
lz4_flex = { version = "0.14.2", optional = true }
rayon = { version = "1.12.0", optional = true }
thiserror = "2.0.21"
itoa = "1"
zstd = { version = "0.14.4", features = ["zstdmt"], optional = true }
mimalloc = { version = "0.1.52", optional = true, default-features = false }
tracing-appender = { version = "0.2.5", optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
loom = "0.7"
tracing-subscriber = { version = "0.3.23", features = ["registry", "std", "fmt"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1.0.154"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "flare"
harness = false

# Benchmarks and release tests must match the committed criterion baseline.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
